name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Aanroepbaar vanuit static.yml, zodat de gate ook vóór deploy draait.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: Verify assets.json is in sync
        run: |
          python3 scripts/generate-assets.py
          if ! git diff --quiet -- assets.json; then
            # Alles behalve het volatiele "generated"-datumveld telt als drift.
            changed=$(git diff -U0 -- assets.json \
              | grep -E '^[+-]' | grep -vE '^[-+]{3} ' | grep -v '"generated"' || true)
            if [ -n "$changed" ]; then
              echo "::error::assets.json is verouderd. Draai 'python3 scripts/generate-assets.py' en commit het resultaat."
              git --no-pager diff -- assets.json
              exit 1
            fi
          fi
          echo "assets.json is in sync."

      - name: Run browser smoke tests
        run: pytest -q
