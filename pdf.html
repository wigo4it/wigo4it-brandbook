<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wigo4it | Markdown naar PDF</title>
  <meta name="description" content="Zet markdown om naar een PDF in de huisstijl van Wigo4it: kies een voorblad, inhoudsopgave en footer, en print naar PDF." />
  <link rel="icon" type="image/svg+xml" href="img/logo/4.svg" />
  <link rel="stylesheet" href="styles/w4.css" />
  <link rel="stylesheet" href="styles/pdf.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="scripts/tailwind-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/pagedjs@0.4.3/dist/paged.js"></script>
</head>
<body class="font-body text-aubergine antialiased">
  <div id="w4-nav"></div>
  <script src="scripts/nav.js"></script>

  <main class="pdf-shell">
    <!-- Instellingen: valt weg bij printen -->
    <form class="pdf-panel no-print" aria-label="PDF-instellingen">
      <div class="pdf-field">
        <div class="pdf-field-head">
          <label for="pdf-markdown">Markdown</label>
          <label class="pdf-upload-btn">
            Bestand kiezen
            <input type="file" id="pdf-file" accept=".md,.markdown,.txt,text/markdown,text/plain" />
          </label>
        </div>
        <textarea id="pdf-markdown" spellcheck="false"
          aria-describedby="pdf-drop-hint"># Titel van het document

Plak of typ hier je markdown. Dit is een **voorbeeld** met een [link](https://wigo4it.nl).

## Eerste sectie

Gewone tekst, een lijst:

- Punt een
- Punt twee
- Punt drie

## Tweede sectie

> Een citaat in de huisstijl.

| Kolom A | Kolom B |
| ------- | ------- |
| 1       | 2       |
</textarea>
        <p class="pdf-hint" id="pdf-drop-hint">Of sleep een .md-bestand op het tekstvak.</p>
      </div>

      <fieldset class="pdf-fieldset">
        <legend>Voorblad</legend>
        <div class="pdf-covers">
          <label class="pdf-cover-opt">
            <input type="radio" name="pdf-cover" value="green" checked />
            <span class="pdf-cover-swatch is-green">Groen</span>
          </label>
          <label class="pdf-cover-opt">
            <input type="radio" name="pdf-cover" value="aubergine" />
            <span class="pdf-cover-swatch is-aubergine">Aubergine</span>
          </label>
          <label class="pdf-cover-opt">
            <input type="radio" name="pdf-cover" value="pink" />
            <span class="pdf-cover-swatch is-pink">Roze</span>
          </label>
          <label class="pdf-cover-opt">
            <input type="radio" name="pdf-cover" value="none" />
            <span class="pdf-cover-swatch is-none">Geen</span>
          </label>
        </div>
      </fieldset>

      <div class="pdf-field">
        <label for="pdf-title">Titel op voorblad</label>
        <input type="text" id="pdf-title" value="Titel van het document" />
      </div>

      <div class="pdf-field">
        <label for="pdf-subtitle">Ondertitel (optioneel)</label>
        <input type="text" id="pdf-subtitle" placeholder="bijv. Kwartaalrapportage 2026" />
      </div>

      <label class="pdf-check">
        <input type="checkbox" id="pdf-toc" />
        Inhoudsopgave toevoegen
      </label>

      <div class="pdf-field">
        <label for="pdf-footer">Footer per pagina (optioneel)</label>
        <input type="text" id="pdf-footer" placeholder="bijv. Wigo4it - vertrouwelijk" />
      </div>

      <div class="pdf-actions">
        <button type="button" class="pdf-btn" id="pdf-print">Exporteer naar PDF</button>
        <p class="pdf-hint">
          Opent het printvenster. Kies "Opslaan als PDF" en zet
          <strong>Achtergrondafbeeldingen</strong> aan, anders verdwijnt het gekleurde voorblad.
        </p>
      </div>
    </form>

    <!-- Preview: toont exact wat er geprint wordt -->
    <section class="pdf-preview" id="pdf-preview" aria-label="Voorbeeld van het document">
      <!-- pdf-app.js vult dit met het samengestelde document -->
    </section>

    <!-- Paged.js rendert hier de gepagineerde export; buiten beeld tot printen -->
    <section class="pdf-paged" id="pdf-paged" aria-hidden="true"></section>
  </main>

  <script type="module" src="scripts/pdf-app.js"></script>
</body>
</html>
